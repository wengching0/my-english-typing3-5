<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英打遊戲開發歷程</title>
  <style>
    body { font-family: system-ui, "Microsoft JhengHei", sans-serif; background: #f5f3ec; color: #243e38; margin: 0; padding: 32px 24px; }
    main { max-width: 1000px; margin: auto; }
    h1 { font-size: 32px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
    .card { background: #fff; border: 1px solid #ccd7ce; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .card h2 { font-size: 20px; margin-top: 0; }
    .card a { display: inline-block; margin-top: 12px; padding: 10px 16px; background: #426d5e; color: #fff; text-decoration: none; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>英打遊戲開發歷程網站</h1>
    <p>展示從版本一到版本四的開發成果。</p>
    <div class="cards">
      <div class="card">
        <div>
          <h2>任務一｜版本一</h2>
          <p>只有標題與按鈕的靜態展示頁。</p>
        </div>
        <a href="https://wengching0.github.io/my-english-typing1/" target="_blank">開啟版本一 →</a>
      </div>
      <div class="card">
        <div>
          <h2>任務二｜版本二</h2>
          <p>加入鍵盤圖片與嗶嗶音效素材。</p>
        </div>
        <a href="https://wengching0.github.io/my-english-typing2/" target="_blank">開啟版本二 →</a>
      </div>
      <div class="card">
        <div>
          <h2>任務四｜版本三 (ASDF)</h2>
          <p>單鍵提示與鍵盤亮燈練習。</p>
        </div>
        <a href="v3/index.html">開啟版本三 →</a>
      </div>
      <div class="card">
        <div>
          <h2>任務五｜版本四 (掉落字母)</h2>
          <p>十鍵字母掉落與速度調節遊戲。</p>
        </div>
        <a href="v4/index.html">開啟版本四 →</a>
      </div>
    </div>
  </main>
</body>
</html>
